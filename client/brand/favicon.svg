<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root { --disc:#1F2227; --a:#9FE0C7; --b:#E8C97A; --rim:rgba(255,255,255,.10); }
    @media (prefers-color-scheme: light) {
      :root { --disc:#F4F4F2; --a:#105E4C; --b:#8C6210; --rim:rgba(20,22,26,.16); }
    }
  </style>
  <defs>
    <clipPath id="disc"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>
